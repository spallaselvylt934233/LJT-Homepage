name: Validate site build

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect generated pages
        run: |
          python - <<'PY'
          import re, pathlib
          for f in ['_site/index.html', '_site/publications/index.html', '_site/cv/index.html']:
              text = pathlib.Path(f).read_text()
              print("==== PAGE:", f)
              print("TITLE:", re.findall(r'<title>(.*?)</title>', text))
              match = re.search(r'<section class="page__content"[^>]*>(.*?)</section>', text, re.S)
              body = match.group(1) if match else 'NO CONTENT SECTION FOUND'
              print("CONTENT:", re.sub(r'\s+', ' ', body)[:6000])
              print("AVATAR TAGS:", re.findall(r'<img[^>]*author__avatar[^>]*>', text))
          PY
